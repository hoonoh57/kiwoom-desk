name: One-time Committed Data Identity Recovery V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-committed-data-identity-v2.yml'

concurrency:
  group: chart-runtime-recovery
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recover:
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply existing verified recovery script
        run: node scripts/recover_committed_data_identity.mjs

      - name: Require both recovered identity and viewport contract
        shell: pwsh
        run: |
          $chart = Get-Content .\src\forms\ChartForm.ts -Raw -Encoding UTF8
          if ($chart -notmatch 'runtimeDataLoadedIdentity') {
            throw 'Strict committed-data identity guard is missing after recovery.'
          }
          if (-not (Test-Path .\src\chart\runtimeViewport.ts)) {
            throw 'runtimeViewport.ts is missing after recovery.'
          }

      - name: Verify canonical runtime contracts
        run: npx tsx --test tests/chartRuntimeHost.test.ts tests/chartRuntimeStateData.test.ts

      - name: Verify existing chart add-ons
        shell: pwsh
        run: |
          npm run test:indicators
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:strategies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Production build
        run: npm run build

      - name: Remove all recovery scaffolding
        shell: pwsh
        run: |
          Remove-Item .\scripts\recover_committed_data_identity.mjs -Force -ErrorAction SilentlyContinue
          Remove-Item .\.github\workflows\recover-committed-data-identity.yml -Force -ErrorAction SilentlyContinue
          Remove-Item .\.github\workflows\recover-committed-data-identity-v2.yml -Force

      - name: Commit one verified recovery state
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            throw 'Recovery produced no verified source change.'
          }
          git commit -m "fix: recover strict chart data identity with viewport contract"
          git push origin HEAD:main
