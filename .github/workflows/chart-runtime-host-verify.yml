name: Chart Runtime Host Verify

on:
  push:
    branches: [main]
    paths:
      - 'src/chart/**'
      - 'src/forms/ChartForm.ts'
      - 'addons/chart-*/**'
      - 'tests/chartRuntimeHost.test.ts'
      - 'tests/chartRuntimeStateData.test.ts'
      - 'tests/indicator*.test.ts'
      - 'tests/strategyAddon.test.ts'
      - 'tests/chartDiagnostics.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/chart-runtime-host-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chart-runtime-host-verify-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify recovered ancestry and strict committed-data identity
        shell: pwsh
        run: |
          git merge-base --is-ancestor ae9acbec9334565d80d4d9a9b64a5c3fc188a263 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'strict identity baseline is not an ancestor of HEAD' }
          if (-not (Test-Path 'src/chart/runtimeViewport.ts')) { throw 'runtimeViewport.ts missing from recovered ancestry' }
          $chart = Get-Content 'src/forms/ChartForm.ts' -Raw -Encoding UTF8
          foreach ($marker in @(
            'private runtimeDataLoadedIdentity',
            'if (!this.bars.length || this.runtimeDataLoadedIdentity !== identity) return undefined;',
            'raw.identity !== this.runtimeDataIdentity()'
          )) {
            if (-not $chart.Contains($marker)) { throw "strict identity marker missing: $marker" }
          }
          $host = Get-Content 'src/chart/runtimeHost.ts' -Raw -Encoding UTF8
          if (-not $host.Contains("CHART_VIEWPORT: 'chart.viewport'")) { throw 'chart.viewport service id missing from ChartRuntimeHost' }

      - name: Verify canonical runtime host
        run: npx tsx --test tests/chartRuntimeHost.test.ts tests/chartRuntimeStateData.test.ts

      - name: Verify indicator compatibility
        run: npm run test:indicators

      - name: Verify strategy compatibility
        run: npm run test:strategies

      - name: Verify diagnostics compatibility
        run: npm run test:diagnostics

      - name: Production build
        run: npm run build

      - name: Record verified source head
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force '.verification' | Out-Null
          $record = [ordered]@{
            schemaVersion = 1
            gate = 'CHART_RUNTIME_HOST_RECOVERY_ATTEST_V1'
            result = 'SUCCESS'
            verifiedSourceHead = '${{ github.sha }}'
            strictIdentityAncestor = 'ae9acbec9334565d80d4d9a9b64a5c3fc188a263'
            runtimeViewport = 'src/chart/runtimeViewport.ts'
            workflow = '.github/workflows/chart-runtime-host-verify.yml'
            node = '24'
            runId = '${{ github.run_id }}'
          }
          $record | ConvertTo-Json -Depth 5 | Set-Content '.verification/chart-runtime-host-recovery-attested.json' -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '.verification/chart-runtime-host-recovery-attested.json'
          git commit -m 'verify: record chart runtime host success'
          git push origin HEAD:main
