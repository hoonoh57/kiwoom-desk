name: One-time Strict Chart Data Identity Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_chartform_data_snapshot_identity.mjs'
      - '.github/workflows/chart-runtime-data-identity-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply strict loaded-data identity guard
        run: node scripts/fix_chartform_data_snapshot_identity.mjs

      - name: Upgrade identity contract assertion
        shell: pwsh
        run: |
          $p = '.\tests\chartRuntimeStateData.test.ts'
          $s = (Get-Content $p -Raw -Encoding UTF8) -replace "`r`n", "`n"
          $old = "  assert.match(source, /identity: this\\.runtimeDataIdentity\\(\\)/);"
          $new = @"
          assert.match(source, /const identity = this\.runtimeDataIdentity\(\)/);
          assert.match(source, /runtimeDataLoadedIdentity !== identity/);
          assert.match(source, /identity,/);
          assert.match(source, /runtimeDataLoadedIdentity = this\.runtimeDataIdentity\(\)/);
          assert.match(source, /runtimeDataLoadedIdentity = ''/);
          "@.TrimEnd()
          if (-not $s.Contains($old)) { throw 'Old chart data identity assertion marker not found.' }
          $s = $s.Replace($old, $new)
          [System.IO.File]::WriteAllText((Resolve-Path $p), $s, [System.Text.UTF8Encoding]::new($false))

      - name: Verify canonical runtime host
        run: npx tsx --test tests/chartRuntimeHost.test.ts tests/chartRuntimeStateData.test.ts

      - name: Verify existing chart add-ons
        shell: pwsh
        run: |
          npm run test:indicators
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:strategies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Production build
        run: npm run build

      - name: Remove migration scaffolding
        shell: pwsh
        run: |
          Remove-Item .\scripts\fix_chartform_data_snapshot_identity.mjs -Force
          Remove-Item .\.github\workflows\chart-runtime-data-identity-migration.yml -Force

      - name: Commit verified loaded-data identity guard
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw 'Loaded-data identity migration produced no source change.' }
          git commit -m "fix: bind chart snapshots to committed data identity"
          git push origin HEAD:main
