name: One-time Native Chart Runtime Host Migration

on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_chartform_runtime_host.mjs'
      - '.github/workflows/chart-runtime-host-native-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply one-time ChartForm migration
        run: node scripts/migrate_chartform_runtime_host.mjs

      - name: Move architecture assertion to the one native Host
        shell: pwsh
        run: |
          $p = '.\tests\indicatorAddon.test.ts'
          $s = (Get-Content $p -Raw -Encoding UTF8) -replace "`r`n", "`n"
          $old = "  assert.equal(source.includes('DMI'), false);`n  assert.equal(source.includes('createChartExtensions'), true);"
          $new = "  assert.equal(source.includes('DMI'), false);`n  assert.equal(source.includes('CHART_RUNTIME_HOST_NATIVE_V1'), true);`n  assert.equal(source.includes('createChartRuntimeHost'), true);`n  assert.equal(source.includes('createChartExtensions'), false);"
          if (-not $s.Contains($old)) { throw 'Indicator architecture assertion marker not found.' }
          $s = $s.Replace($old, $new)
          [System.IO.File]::WriteAllText((Resolve-Path $p), $s, [System.Text.UTF8Encoding]::new($false))

      - name: Verify canonical runtime host
        run: npx tsx --test tests/chartRuntimeHost.test.ts

      - name: Verify existing chart add-ons
        shell: pwsh
        run: |
          npm run test:indicators
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:strategies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Production build
        run: npm run build

      - name: Remove migration scaffolding
        shell: pwsh
        run: |
          Remove-Item .\scripts\migrate_chartform_runtime_host.mjs -Force
          Remove-Item .\.github\workflows\chart-runtime-host-native-migration.yml -Force

      - name: Commit verified native wiring
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            throw 'Native ChartRuntimeHost migration produced no committed source change.'
          }
          git commit -m "refactor: wire ChartForm to canonical runtime host"
          git push origin HEAD:main
