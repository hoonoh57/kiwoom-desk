name: Migrate Native MDI Window Owner One-Time

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-native-mdi-window-owner-one-time.yml'

permissions:
  contents: write

concurrency:
  group: migrate-native-mdi-window-owner-one-time
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Apply semantic native MDI owner migration
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          dock_path = Path('src/shell/DockHost.ts')
          dock = dock_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          dock = replace_once(
              dock,
              "  private isChartPanel(panel: IDockviewPanel | undefined): boolean {\n    return String((panel?.params as any)?.formId ?? '') === 'chart';\n  }\n\n",
              '',
              'chart-only native MDI filter',
          )
          dock = replace_once(
              dock,
              '    if (!panel || !this.isChartPanel(panel)) return;',
              '    if (!panel) return;',
              'native MDI action guard',
          )
          dock = replace_once(
              dock,
              "    if (!panel || !this.isChartPanel(panel)) {\n      this.element.hidden = true;\n      return;\n    }",
              "    if (!panel) {\n      this.element.hidden = true;\n      return;\n    }",
              'native MDI render guard',
          )
          dock = replace_once(
              dock,
              '// 키움식 창 제어는 floating child / 독립 popout에만 표시한다.',
              '// Native MDI window controls belong to every floating child / independent popout regardless of form type.',
              'native MDI owner comment',
          )
          if 'isChartPanel' in dock:
              raise SystemExit('form-specific native MDI filter survived migration')
          dock_path.write_text(dock, encoding='utf-8')

          test_path = Path('tests/dockWindowControls.test.ts')
          test = test_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          marker = '  assert.match(dock, /data-win="close"/);'
          test = replace_once(
              test,
              marker,
              marker + "\n  assert.equal(dock.includes('isChartPanel'), false, 'native MDI shell must not hide controls behind a form-specific filter');",
              'native MDI test assertion',
          )
          test_path.write_text(test, encoding='utf-8')

          workflow_path = Path('.github/workflows/chart-runtime-host-verify.yml')
          workflow = workflow_path.read_text(encoding='utf-8').replace('\r\n', '\n')
          form_path = "      - 'src/forms/ChartForm.ts'\n"
          if workflow.count(form_path) != 2:
              raise SystemExit(f'ChartForm workflow path count drifted: {workflow.count(form_path)}')
          workflow = workflow.replace(form_path, form_path + "      - 'src/shell/DockHost.ts'\n", 2)
          diag_path = "      - 'tests/chartDiagnostics.test.ts'\n"
          if workflow.count(diag_path) != 2:
              raise SystemExit(f'diagnostics workflow path count drifted: {workflow.count(diag_path)}')
          workflow = workflow.replace(
              diag_path,
              diag_path + "      - 'tests/dockWindowControls.test.ts'\n      - 'tests/chartWindowPolicy.test.ts'\n",
              2,
          )
          diag_step = "      - name: Verify diagnostics compatibility\n        run: npm run test:diagnostics\n\n"
          workflow = replace_once(
              workflow,
              diag_step,
              diag_step + "      - name: Verify native MDI window compatibility\n        run: npm run test:chart-window\n\n",
              'permanent native MDI verification step',
          )
          workflow_path.write_text(workflow, encoding='utf-8')
          '@ | Set-Content .verification_native_mdi_migrate.py -Encoding UTF8
          python .verification_native_mdi_migrate.py
          Remove-Item .verification_native_mdi_migrate.py -Force
          git diff --check

      - name: Verify strict identity and native Host seam
        shell: pwsh
        run: |
          git merge-base --is-ancestor ae9acbec9334565d80d4d9a9b64a5c3fc188a263 HEAD
          if ($LASTEXITCODE -ne 0) { throw 'strict identity baseline is not an ancestor of HEAD' }
          npx tsx --test tests/projectRuntimeSeam.test.ts tests/chartRuntimeHost.test.ts tests/chartRuntimeStateData.test.ts
          exit $LASTEXITCODE

      - name: Verify optional chart compatibility
        shell: pwsh
        run: |
          npm run test:indicators
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:strategies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:chart-window
          exit $LASTEXITCODE

      - name: Production build
        run: npm run build

      - name: Commit verified framework fix and remove one-time gate
        shell: pwsh
        run: |
          git rm '.github/workflows/migrate-native-mdi-window-owner-one-time.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/shell/DockHost.ts tests/dockWindowControls.test.ts .github/workflows/chart-runtime-host-verify.yml
          git commit -m 'fix: make native MDI window controls form-agnostic'
          git pull --rebase origin main
          git push origin HEAD:main
