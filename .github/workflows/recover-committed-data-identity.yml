name: One-time Committed Data Identity Recovery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/recover_committed_data_identity.mjs'
      - '.github/workflows/recover-committed-data-identity.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Recover committed-data identity guard
        run: node scripts/recover_committed_data_identity.mjs

      - name: Require runtime viewport contract to remain present
        shell: pwsh
        run: |
          if (-not (Test-Path .\src\chart\runtimeViewport.ts)) {
            throw 'runtimeViewport.ts was lost while recovering committed-data identity.'
          }

      - name: Verify canonical runtime host and state data contracts
        run: npx tsx --test tests/chartRuntimeHost.test.ts tests/chartRuntimeStateData.test.ts

      - name: Verify existing chart add-ons
        shell: pwsh
        run: |
          npm run test:indicators
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:strategies
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:diagnostics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Production build
        run: npm run build

      - name: Remove recovery scaffolding
        shell: pwsh
        run: |
          Remove-Item .\scripts\recover_committed_data_identity.mjs -Force
          Remove-Item .\.github\workflows\recover-committed-data-identity.yml -Force

      - name: Commit verified recovery
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) {
            throw 'Committed-data identity recovery produced no verified source change.'
          }
          git commit -m "fix: restore committed-data identity with viewport contract"
          git push origin HEAD:main
